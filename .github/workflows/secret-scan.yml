name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: python3 scripts/install_secret_guard.py --tools-only
      - name: Scan all reachable history
        run: python3 scripts/secret_guard.py history
      - name: Verify guard behavior
        run: python3 -m unittest discover -s custody/tests
